<div class="signup__container">
  <button type="button" class="signup__return-btn btn btn-link"
    (click)="onClickReturn()">
    ← 戻る
  </button>
  <form [formGroup]="signupForm" (submit)="onSubmit()"
    class="signup__form-container">
    <div class="d-flex align-items-center justify-content-center">
      <h1 class="heading-page-title">サインアップ</h1>
    </div>
    <!-- ユーザー -->
    <div class="signup__input-wrapper">
      <label for="signup__username">ユーザー名 *</label>
      <div class="input-group">
        <span class="input-group-text" id="basic-addon1">
          <i class="bi bi-person"></i>
        </span>
        <input type="text" formControlName="username" id="signup__username"
          class="form-control"
          [class.is-invalid]="name?.touched && name?.invalid">
      </div>
      <span class="danger" *ngIf="name?.touched && name?.errors?.['required']">
        ユーザー名は必須です。
      </span>
    </div>
    <!-- メールアドレス -->
    <div class="signup__input-wrapper">
      <label for="signup__email">メールアドレス *</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input type="email" formControlName="email" id="signup__email"
          class="form-control ng-invalid"
          [class.is-invalid]="email?.touched && email?.invalid">
      </div>
      <span class="danger"
        *ngIf="email?.touched && email?.errors?.['required']">
        メールアドレスは必須です。
      </span>
      <span class="danger" *ngIf="email?.touched && email?.errors?.['email']">
        メールアドレス形式で入力してください。
      </span>
    </div>
    <!-- パスワード -->
    <div class="signup__input-wrapper">
      <label for="signup__password">パスワード *</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" formControlName="password" id="signup__password"
          class="form-control"
          [class.is-invalid]="password?.touched && password?.invalid">
      </div>
      <span class="danger"
        *ngIf="password?.touched && password?.errors?.['required']">
        パスワードは必須です。
      </span>
    </div>
    <!-- パスワード（確認） -->
    <div class="signup__input-wrapper">
      <label for="signup__confirm-password">パスワード（確認） *</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" formControlName="confirmPassword"
          id="signup__confirm-password" class="form-control"
          [class.is-invalid]="confirmPassword?.touched && confirmPassword?.invalid 
          || confirmPassword?.touched && signupForm.errors?.['passwordMismatch']">
      </div>
      <span class="danger"
        *ngIf="confirmPassword?.touched && confirmPassword?.errors?.['required']">
        パスワードは必須です。
      </span>
      <span class="danger"
        *ngIf="confirmPassword?.touched && confirmPassword?.errors?.['passwordMismatch']">
        パスワードが一致しません。
      </span>
    </div>

    <div class="d-flex align-items-center justify-content-center">
      <button type="submit" class="btn btn-primary">登録</button>
    </div>
  </form>
</div>
